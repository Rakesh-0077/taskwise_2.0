name: taskwise_app
description: "A smart acade ic and employee time planner with resources and voice assistance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  url_launcher: ^6.2.5
  google_generative_ai: ^0.4.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
